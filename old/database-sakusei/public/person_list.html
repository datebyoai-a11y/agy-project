<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>対象者一覧</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
    }
    th {
      background: #eee;
    }
  </style>
</head>
<body>
  <h2>対象者一覧</h2>

  <table id="personTable">
    <thead>
      <tr>
        <th>氏名</th>
        <th>生年月日</th>
        <th>メモ</th>
        <th>作成者</th>
        <th>作成日</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadPeople() {
      const res = await fetch("/person/list");
      const people = await res.json();

      const tbody = document.querySelector("#personTable tbody");
      tbody.innerHTML = "";

      people.forEach(p => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${p.name}</td>
          <td>${new Date(p.birthDate).toLocaleDateString()}</td>
          <td>${p.memo || ""}</td>
          <td>${p.createdBy}</td>
          <td>${new Date(p.createdAt).toLocaleString()}</td>
        `;

        tbody.appendChild(tr);
      });
    }

    loadPeople();
  </script>
</body>
</html>
