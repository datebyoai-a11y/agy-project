<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>対象者登録</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 40px;
      background: #f5f5f5;
    }
    .container {
      width: 350px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>対象者登録</h2>

    <form action="/person/create" method="POST">
      <input type="text" name="name" placeholder="氏名" required />
      <input type="date" name="birthDate" required />
      <textarea name="memo" placeholder="メモ（任意）"></textarea>
      <button type="submit">登録する</button>
    </form>

    <form action="/login" method="GET">
      <button>ログイン画面へ戻る</button>
    </form>
<form action="/person_list.html" method="GET">
  <button>対象者一覧を見る</button>
</form> 
</div>
</body>
</html>
