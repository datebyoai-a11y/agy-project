<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ログイン</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 40px;
      background: #f5f5f5;
    }
    .container {
      width: 300px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
    }
    .link-btn {
      background: #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>ログイン</h2>

    <form action="/auth/login" method="POST">
      <input type="text" name="username" placeholder="ユーザー名" required />
      <input type="password" name="password" placeholder="パスワード" required />
      <button type="submit">ログイン</button>
    </form>

    <!-- 新規登録画面へ遷移 -->
    <form action="/register" method="GET">
      <button class="link-btn">新規ユーザー登録へ</button>
    </form>
  </div>
</body>
</html>
